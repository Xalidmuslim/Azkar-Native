def gitBlobSha1 = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-1')
    digest.update(("blob " + file.length() + "\u0000").getBytes('UTF-8'))
    file.withInputStream { input ->
        byte[] buffer = new byte[64 * 1024]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().encodeHex().toString()
}

tasks.register('prepareAzkarIcon') {
    def outputDir = new File(azkarGeneratedIconRes, 'drawable-nodpi')
    def target = new File(outputDir, 'azkar_launcher_exact.webp')
    inputs.files(azkarIconChunks)
    outputs.file(target)

    doLast {
        outputDir.mkdirs()
        String encoded = azkarIconChunks.collect { chunk ->
            chunk.getText('UTF-8').trim()
        }.join('')
        byte[] bytes = java.util.Base64.decoder.decode(encoded)

        if (bytes.length != 23960) {
            throw new GradleException("Azkar launcher icon size mismatch: ${bytes.length}")
        }

        String digest = java.security.MessageDigest
            .getInstance('SHA-256')
            .digest(bytes)
            .encodeHex()
            .toString()
        if (digest != '203f62f41359a50c03e21a354bed68c0d2ace28d347dd60d13b08e19cf59375f') {
            throw new GradleException("Azkar launcher icon hash mismatch: ${digest}")
        }

        target.bytes = bytes
    }
}

tasks.register('prepareAzkarFonts') {
    def outputDir = new File(azkarGeneratedFontRes, 'font')
    outputs.dir(outputDir)

    doLast {
        outputDir.mkdirs()
        azkarFontSpecs.each { spec ->
            File target = new File(outputDir, spec.file)
            boolean validExisting = target.isFile() &&
                target.length() == spec.size &&
                gitBlobSha1(target) == spec.gitBlobSha

            if (!validExisting) {
                target.delete()
                String url = "https://raw.githubusercontent.com/google/fonts/${azkarGoogleFontsCommit}/${spec.path}"
                def connection = new java.net.URL(url).openConnection()
                connection.connectTimeout = 15000
                connection.readTimeout = 60000
                connection.inputStream.withCloseable { input ->
                    target.withOutputStream { output -> output << input }
                }
            }

            if (target.length() != spec.size || gitBlobSha1(target) != spec.gitBlobSha) {
                target.delete()
                throw new GradleException("Azkar font verification failed: ${spec.file}")
            }
        }
    }
}

android {
    namespace 'app.xalidmuslim.azkar'
    compileSdk 35

    defaultConfig {
        applicationId 'app.xalidmuslim.azkar'
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName '0.2.9-manual'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    sourceSets {
        main {
            res.srcDir azkarGeneratedFontRes
            res.srcDir azkarGeneratedIconRes
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        animationsDisabled = true
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareAzkarFonts')
    dependsOn tasks.named('prepareAzkarIcon')
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation-core'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.4'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'

    androidTestImplementation platform('androidx.compose:compose-bom:2024.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
