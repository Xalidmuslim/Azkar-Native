name: Azkar Phase 4 Card Targeted Diagnostic

on:
  push:
    branches:
      - azkar-native-phase4-card-diagnostic-2026-09-29

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile targeted instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Prepare targeted runner
        shell: bash
        run: |
          mkdir -p phase4-targeted
          cat > phase4-targeted.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APP_PACKAGE="app.xalidmuslim.azkar"
          TEST_PACKAGE="app.xalidmuslim.azkar.test"
          TEST_COMPONENT="$TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner"
          TEST_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarPhase4PersistenceScreenshotTest"
          METHOD="capture393LightPartialProgress"
          REMOTE_DIR="/sdcard/Android/data/$APP_PACKAGE/files/phase2-evidence"
          FILE="azkar_phase4_393_light_partial_progress.png"

          adb wait-for-device
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell wm size 393x873
          adb shell wm density 160
          adb shell settings put system font_scale 1.0
          timeout 15s adb shell am wait-for-broadcast-idle || true
          adb logcat -c || true

          set +e
          adb shell am instrument -w -r -e class "$TEST_CLASS#$METHOD" "$TEST_COMPONENT" | tee phase4-targeted/instrumentation.txt
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          adb logcat -d -v threadtime > phase4-targeted/logcat.txt || true

          if [ "$TEST_EXIT" -ne 0 ]; then exit "$TEST_EXIT"; fi
          grep -q "OK (1 test)" phase4-targeted/instrumentation.txt
          adb pull "$REMOTE_DIR/$FILE" "phase4-targeted/$FILE"
          test -s "phase4-targeted/$FILE"
          file "phase4-targeted/$FILE" | tee phase4-targeted/file.txt
          grep -q "PNG image data, 393 x 873" phase4-targeted/file.txt
          if grep -RInE 'ANR in app\.xalidmuslim\.azkar|FATAL EXCEPTION|Process crashed|INSTRUMENTATION_FAILED' phase4-targeted/*.txt; then
            echo "Startup/runtime fatal marker detected"
            exit 1
          fi
          EOF
          chmod +x phase4-targeted.sh

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
          echo "KVM WORKING" | tee phase4-targeted/kvm.txt

      - name: Run targeted diagnostic
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash phase4-targeted.sh

      - name: Upload targeted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azkar-phase4-card-targeted-diagnostic
          path: phase4-targeted/**
          if-no-files-found: warn
          retention-days: 7
