name: Azkar Phase 3B Reader Sheets

on:
  push:
    branches:
      - azkar-native-phase3b-reader-sheets-2026-09-29
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile Compose/Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Prepare Phase 3B instrumentation
        shell: bash
        run: |
          mkdir -p phase3b-diagnostics phase3b-evidence
          cat > phase3b-reader-sheets.sh <<'EOF'
          #!/usr/bin/env bash
          set -u
          set -o pipefail

          APP_PACKAGE="app.xalidmuslim.azkar"
          TEST_PACKAGE="app.xalidmuslim.azkar.test"
          TEST_COMPONENT="$TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner"
          NAV_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarReaderNavigationInstrumentedTest"
          SHEET_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarReaderSheetInstrumentedTest"
          GOLDEN_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarGoldenReadingScreenshotTest"
          REMOTE_DIR="/sdcard/Android/data/$APP_PACKAGE/files/phase2-evidence"

          adb wait-for-device
          adb shell getprop sys.boot_completed
          adb devices -l

          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace || exit 1
          adb install -r app/build/outputs/apk/debug/app-debug.apk || exit 1
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk || exit 1

          adb shell wm size 393x873
          adb shell wm density 160
          adb shell settings put system font_scale 1.0
          timeout 15s adb shell am wait-for-broadcast-idle || true
          adb logcat -c || true

          set +e
          adb shell am instrument -w -r -e class "$NAV_CLASS" "$TEST_COMPONENT" | tee phase3b-diagnostics/navigation-instrumentation.txt
          NAV_EXIT=${PIPESTATUS[0]}
          set -e
          echo "$NAV_EXIT" > phase3b-diagnostics/navigation-exit.txt
          if [ "$NAV_EXIT" -ne 0 ]; then exit "$NAV_EXIT"; fi
          grep -q "OK (10 tests)" phase3b-diagnostics/navigation-instrumentation.txt || exit 1

          set +e
          TARGETED_SHEETS="$SHEET_CLASS#contentsSheetOpensAndDirectNavigationClosesIt,$SHEET_CLASS#explanationBackPreservesReaderContext"
          adb shell am instrument -w -r -e class "$TARGETED_SHEETS" "$TEST_COMPONENT" | tee phase3b-diagnostics/sheets-instrumentation.txt
          SHEET_EXIT=${PIPESTATUS[0]}
          set -e
          echo "$SHEET_EXIT" > phase3b-diagnostics/sheets-exit.txt
          adb logcat -d -v threadtime > phase3b-diagnostics/instrumentation-logcat.txt || true
          if [ "$SHEET_EXIT" -ne 0 ]; then exit "$SHEET_EXIT"; fi
          grep -q "OK (2 tests)" phase3b-diagnostics/sheets-instrumentation.txt || exit 1
          exit 0

          run_golden() {
            method="$1"
            screen="$2"
            filename="$3"
            width="$4"
            height="$5"

            adb shell wm size "$screen" || return 1
            adb shell wm density 160 || return 1
            adb shell settings put system font_scale 1.0 || return 1
            timeout 15s adb shell am wait-for-broadcast-idle || true

            set +e
            adb shell am instrument -w -r -e class "$GOLDEN_CLASS#$method" "$TEST_COMPONENT" | tee "phase3b-diagnostics/golden-$method.txt"
            TEST_EXIT=${PIPESTATUS[0]}
            set -e
            if [ "$TEST_EXIT" -ne 0 ]; then return 1; fi
            grep -q "OK (1 test)" "phase3b-diagnostics/golden-$method.txt" || return 1

            adb pull "$REMOTE_DIR/$filename" "phase3b-evidence/$filename" || return 1
            test -s "phase3b-evidence/$filename" || return 1
            stat -c '%n %s bytes' "phase3b-evidence/$filename" | tee "phase3b-diagnostics/golden-file-$method.txt"
            file "phase3b-evidence/$filename" | tee -a "phase3b-diagnostics/golden-file-$method.txt" || return 1
            grep -q "PNG image data, $width x $height" "phase3b-diagnostics/golden-file-$method.txt" || return 1
          }

          run_golden capture360Light 360x800 azkar_360x800_light.png 360 800 || exit 1
          run_golden capture393Light 393x873 azkar_393x873_light.png 393 873 || exit 1
          run_golden capture412Light 412x915 azkar_412x915_light.png 412 915 || exit 1
          run_golden capture393Dark 393x873 azkar_393x873_dark.png 393 873 || exit 1
          run_golden capture393LongExistingDhikr 393x873 azkar_393x873_long_baqarah.png 393 873 || exit 1

          adb logcat -d -v threadtime > phase3b-diagnostics/final-logcat.txt || true
          grep -RInE -C 5 'ANR in app\.xalidmuslim\.azkar|FATAL EXCEPTION|Process crashed|INSTRUMENTATION_FAILED|ClassNotFoundException|NoClassDefFoundError|Unable to instantiate|Unable to start' phase3b-diagnostics/*.txt 2>/dev/null || true

          adb uninstall "$TEST_PACKAGE" || true
          adb uninstall "$APP_PACKAGE" || true
          adb shell wm size reset || true
          adb shell wm density reset || true
          adb shell settings put system font_scale 1.0 || true
          EOF
          chmod +x phase3b-reader-sheets.sh

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is not available"
            exit 1
          fi

      - name: Run Phase 3B instrumentation and golden regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash phase3b-reader-sheets.sh

      - name: Upload Phase 3B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azkar-phase3b-reader-sheets-evidence
          path: |
            phase3b-evidence/**
            phase3b-diagnostics/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: error
          retention-days: 30
