name: Azkar Phase 2 Golden Screen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile Compose/Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint affected module
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Prepare Phase 2 393 Light verification script
        shell: bash
        run: |
          mkdir -p phase2-diagnostics phase2-evidence
          cat > phase2-393-light.sh <<'EOF'
          #!/usr/bin/env bash
          set -u
          set -o pipefail

          mkdir -p phase2-diagnostics phase2-evidence
          APP_PACKAGE="app.xalidmuslim.azkar"
          TEST_COMPONENT="app.xalidmuslim.azkar.test/androidx.test.runner.AndroidJUnitRunner"
          TEST_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarGoldenReadingScreenshotTest"
          METHOD="capture393Light"
          FILE="azkar_393x873_light.png"
          REMOTE_DIR="/sdcard/Android/data/${APP_PACKAGE}/files/phase2-evidence"

          adb wait-for-device
          adb shell getprop sys.boot_completed
          adb devices -l

          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace || exit 1
          adb install -r app/build/outputs/apk/debug/app-debug.apk || exit 1
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk || exit 1

          adb shell wm size 393x873
          adb shell wm density 160
          adb shell settings put system font_scale 1.0
          adb shell wm size | tee phase2-diagnostics/wm-size.txt
          adb shell wm density | tee phase2-diagnostics/wm-density.txt
          adb shell settings get system font_scale | tee phase2-diagnostics/font-scale.txt
          grep -q "Override size: 393x873" phase2-diagnostics/wm-size.txt || exit 1
          grep -q "Override density: 160" phase2-diagnostics/wm-density.txt || exit 1
          grep -qx "1.0" phase2-diagnostics/font-scale.txt || exit 1

          timeout 15s adb shell am wait-for-broadcast-idle || true
          adb logcat -c || true

          set +e
          adb shell am instrument -w -r \
            -e class "${TEST_CLASS}#${METHOD}" \
            "${TEST_COMPONENT}" \
            | tee phase2-diagnostics/instrumentation-${METHOD}.txt
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "${TEST_EXIT}" | tee phase2-diagnostics/test-exit-${METHOD}.txt

          adb logcat -d -v threadtime > phase2-diagnostics/logcat-${METHOD}.txt || true

          if [ "${TEST_EXIT}" -ne 0 ]; then
            echo "${METHOD}: instrumentation exit status ${TEST_EXIT}"
            exit "${TEST_EXIT}"
          fi
          grep -q "OK (1 test)" phase2-diagnostics/instrumentation-${METHOD}.txt || {
            echo "${METHOD}: instrumentation did not report OK (1 test)"
            exit 1
          }

          adb pull "${REMOTE_DIR}/${FILE}" "phase2-evidence/${FILE}"
          test -s "phase2-evidence/${FILE}"
          stat -c '%n %s bytes' "phase2-evidence/${FILE}" | tee phase2-diagnostics/file-${METHOD}.txt
          file "phase2-evidence/${FILE}" | tee -a phase2-diagnostics/file-${METHOD}.txt
          grep -q "PNG image data, 393 x 873" phase2-diagnostics/file-${METHOD}.txt || exit 1

          echo "===== ANR/crash scan ====="
          grep -n -E -C 5 \
            'ANR in app\.xalidmuslim\.azkar|FATAL EXCEPTION|Process crashed|INSTRUMENTATION_FAILED|ClassNotFoundException|NoClassDefFoundError|Unable to instantiate|Unable to start' \
            phase2-diagnostics/logcat-${METHOD}.txt || true

          adb uninstall app.xalidmuslim.azkar.test || true
          adb uninstall "${APP_PACKAGE}" || true
          adb shell wm size reset || true
          adb shell wm density reset || true
          adb shell settings put system font_scale 1.0 || true
          EOF
          chmod +x phase2-393-light.sh

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is not available"
            exit 1
          fi

      - name: Verify Phase 2 capture393Light
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash phase2-393-light.sh

      - name: Upload Phase 2 393 Light evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azkar-phase2-393-light-fixed
          path: |
            phase2-evidence/**
            phase2-diagnostics/**
          if-no-files-found: error
          retention-days: 30
