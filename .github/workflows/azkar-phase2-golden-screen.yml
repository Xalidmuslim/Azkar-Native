name: Azkar Phase 2 Golden Screen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile Compose/Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint affected module
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Prepare Phase 2 instrumentation diagnostic script
        shell: bash
        run: |
          mkdir -p phase2-diagnostics phase2-evidence
          printf 'diagnostics prepared\n' > phase2-diagnostics/ci-diagnostics-prepared.txt
          cat > phase2-instrumentation-diagnostics.sh <<'EOF'
          #!/usr/bin/env bash
          set -u

          mkdir -p phase2-diagnostics phase2-evidence

          adb wait-for-device
          adb shell getprop sys.boot_completed
          adb devices -l

          adb shell pm list instrumentation | tee phase2-diagnostics/instrumentation-list-before.txt || true
          adb shell pm path app.xalidmuslim.azkar | tee phase2-diagnostics/package-path-before.txt || true

          adb shell wm density 160
          adb shell settings put system font_scale 1.0
          adb shell wm size 360x800
          sleep 2

          adb logcat -c

          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

          set +e
          adb shell am instrument -w -r \
            -e class "app.xalidmuslim.azkar.ui.reading.AzkarGoldenReadingScreenshotTest#capture360Light" \
            app.xalidmuslim.azkar.test/androidx.test.runner.AndroidJUnitRunner \
            | tee phase2-diagnostics/instrumentation-output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          set -e

          printf '%s\n' "$TEST_EXIT" | tee phase2-diagnostics/test-exit.txt

          adb logcat -d -v threadtime > phase2-diagnostics/logcat.txt || true
          adb shell pm list instrumentation > phase2-diagnostics/instrumentation-list.txt || true
          adb shell dumpsys package app.xalidmuslim.azkar > phase2-diagnostics/package-dump.txt || true

          if [ -d app/build/reports/androidTests/connected/debug ]; then
            mkdir -p phase2-diagnostics/androidTests-report
            cp -a app/build/reports/androidTests/connected/debug/. phase2-diagnostics/androidTests-report/ || true
          fi

          if [ -d app/build/outputs/androidTest-results/connected ]; then
            mkdir -p phase2-diagnostics/androidTest-results
            cp -a app/build/outputs/androidTest-results/connected/. phase2-diagnostics/androidTest-results/ || true
          fi

          if [ -d app/build/outputs/managed_device_android_test_additional_output ]; then
            mkdir -p phase2-diagnostics/managed-device-additional-output
            cp -a app/build/outputs/managed_device_android_test_additional_output/. phase2-diagnostics/managed-device-additional-output/ || true
          fi

          adb pull "/sdcard/Android/data/app.xalidmuslim.azkar/files/phase2-evidence/azkar_360x800_light.png" \
            "phase2-evidence/azkar_360x800_light.png"
          test -s "phase2-evidence/azkar_360x800_light.png"

          if ! grep -q "OK (1 test)" phase2-diagnostics/instrumentation-output.txt; then
            echo "Instrumentation did not report OK (1 test)"
            TEST_EXIT=1
          fi

          adb uninstall app.xalidmuslim.azkar.test || true
          adb uninstall app.xalidmuslim.azkar || true

          echo "===== instrumentation list after test ====="
          cat phase2-diagnostics/instrumentation-list.txt || true

          echo "===== Phase 2 logcat root-cause extraction ====="
          grep -n -E -C 8             'FATAL EXCEPTION|AndroidRuntime|Process:|Caused by:|ClassNotFoundException|NoClassDefFoundError|Unable to instantiate|Unable to start|INSTRUMENTATION_FAILED|INSTRUMENTATION_STATUS|androidx\.test|AndroidJUnitRunner|TestActivity|app\.alfatiha\.tafsir'             phase2-diagnostics/logcat.txt || true

          echo "===== Phase 2 instrumentation report extraction ====="
          grep -RInE -C 5             'FATAL EXCEPTION|AndroidRuntime|Process:|Caused by:|ClassNotFoundException|NoClassDefFoundError|Unable to instantiate|Unable to start|INSTRUMENTATION_FAILED|INSTRUMENTATION_STATUS|androidx\.test|AndroidJUnitRunner|TestActivity|app\.alfatiha\.tafsir|Process crashed'             phase2-diagnostics/androidTests-report             phase2-diagnostics/androidTest-results 2>/dev/null || true

          adb shell wm size reset || true
          adb shell wm density reset || true

          exit "$TEST_EXIT"
          EOF
          chmod +x phase2-instrumentation-diagnostics.sh

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is not available"
            exit 1
          fi

      - name: Diagnose Phase 2 instrumentation crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash phase2-instrumentation-diagnostics.sh

      - name: Upload Phase 2 instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azkar-phase2-instrumentation-diagnostics
          path: |
            phase2-diagnostics/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/managed_device_android_test_additional_output/**
            phase2-evidence/**
          if-no-files-found: error
          retention-days: 30
