name: Azkar Phase 5 Production Content

on:
  push:
    branches:
      - azkar-native-phase5-production-content-2026-09-30
  workflow_dispatch:

jobs:
  phase5_explanation_diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Assemble app and androidTest
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Prepare explanation diagnostic
        shell: bash
        run: |
          mkdir -p phase5-targeted-diagnostics
          cat > phase5-targeted-explanation.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APP_PACKAGE="app.xalidmuslim.azkar"
          TEST_PACKAGE="app.xalidmuslim.azkar.test"
          TEST_COMPONENT="$TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner"
          TEST_METHOD="app.xalidmuslim.azkar.ui.reading.AzkarPhase5ProductionContentInstrumentedTest#explanationOpensForCurrentEveningItem"
          adb wait-for-device
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell wm size 393x873
          adb shell wm density 160
          adb shell settings put system font_scale 1.0
          timeout 15s adb shell am wait-for-broadcast-idle || true
          adb logcat -c || true
          set +e
          adb shell am instrument -w -r -e class "$TEST_METHOD" "$TEST_COMPONENT" | tee phase5-targeted-diagnostics/explanation-instrumentation.txt
          test_exit=${PIPESTATUS[0]}
          set -e
          adb logcat -d -v threadtime -s AzkarPhase5Diag:I '*:S' | tee phase5-targeted-diagnostics/explanation-logcat.txt
          [ "$test_exit" -eq 0 ]
          grep -q "OK (1 test)" phase5-targeted-diagnostics/explanation-instrumentation.txt
          EOF
          chmod +x phase5-targeted-explanation.sh
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          echo "KVM WORKING" | tee phase5-targeted-diagnostics/kvm.txt
      - name: Run explanation diagnostic only
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash phase5-targeted-explanation.sh
      - name: Upload targeted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azkar-phase5-explanation-diagnostic
          path: phase5-targeted-diagnostics/**
          if-no-files-found: error
          retention-days: 7
