name: Azkar Phase 5 Production Content

on:
  push:
    branches:
      - azkar-native-phase5-production-content-2026-09-30
  workflow_dispatch:

jobs:
  compile_android_test_only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Compile androidTest only
        run: ./gradlew :app:compileDebugAndroidTestKotlin --stacktrace
