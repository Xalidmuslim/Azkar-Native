name: Azkar Phase 5 Production Content

on:
  push:
    branches:
      - azkar-native-phase5-production-content-2026-09-30
  workflow_dispatch:

jobs:
  phase5_screenshots_only:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Assemble app and androidTest
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Prepare Phase 5 screenshots only
        shell: bash
        run: |
          mkdir -p phase5-evidence phase5-screenshot-diagnostics
          cat > phase5-targeted-screenshots.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APP_PACKAGE="app.xalidmuslim.azkar"
          TEST_PACKAGE="app.xalidmuslim.azkar.test"
          TEST_COMPONENT="$TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner"
          REMOTE_DIR="/sdcard/Android/data/$APP_PACKAGE/files/phase2-evidence"
          CLASS="app.xalidmuslim.azkar.ui.reading.AzkarPhase5ProductionContentScreenshotTest"

          adb wait-for-device
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb logcat -c || true

          run_capture() {
            local method="$1" screen="$2" filename="$3" width="$4" height="$5"
            adb shell wm size "$screen"
            adb shell wm density 160
            adb shell settings put system font_scale 1.0
            timeout 15s adb shell am wait-for-broadcast-idle || true
            set +e
            adb shell am instrument -w -r -e class "$CLASS#$method" "$TEST_COMPONENT" | tee "phase5-screenshot-diagnostics/$method.txt"
            local exit_code=${PIPESTATUS[0]}
            set -e
            [ "$exit_code" -eq 0 ]
            grep -q "OK (1 test)" "phase5-screenshot-diagnostics/$method.txt"
            adb pull "$REMOTE_DIR/$filename" "phase5-evidence/$filename"
            test -s "phase5-evidence/$filename"
            file "phase5-evidence/$filename" | tee "phase5-screenshot-diagnostics/file-$method.txt"
            grep -q "PNG image data, $width x $height" "phase5-screenshot-diagnostics/file-$method.txt"
          }

          run_capture capture393LightMorningFirst 393x873 azkar_phase5_393_light_morning_first.png 393 873
          run_capture capture393LightEveningFirst 393x873 azkar_phase5_393_light_evening_first.png 393 873
          run_capture capture393LightMorningContents 393x873 azkar_phase5_393_light_morning_contents.png 393 873
          run_capture capture393LightEveningContents 393x873 azkar_phase5_393_light_evening_contents.png 393 873
          run_capture capture393LightEveningKingdomVariant 393x873 azkar_phase5_393_light_evening_kingdom.png 393 873
          run_capture capture393LightMorningKingdomVariant 393x873 azkar_phase5_393_light_morning_kingdom.png 393 873
          run_capture capture393LightEveningList 393x873 azkar_phase5_393_light_evening_list.png 393 873
          run_capture capture393DarkEvening 393x873 azkar_phase5_393_dark_evening.png 393 873
          run_capture capture360LightMorning 360x800 azkar_phase5_360_light_morning.png 360 800
          run_capture capture412LightEvening 412x915 azkar_phase5_412_light_evening.png 412 915
          run_capture captureLongEveningBaqarahLastTwo 393x873 azkar_phase5_393_long_evening_baqarah.png 393 873
          run_capture captureCompletedProgressAfterPeriodSwitch 393x873 azkar_phase5_393_completed_after_switch.png 393 873

          test "$(find phase5-evidence -maxdepth 1 -name '*.png' | wc -l)" -eq 12
          adb logcat -d -v threadtime > phase5-screenshot-diagnostics/final-logcat.txt || true
          if grep -RInE 'ANR in app\.xalidmuslim\.azkar|FATAL EXCEPTION|Process crashed|INSTRUMENTATION_FAILED|ClassNotFoundException|NoClassDefFoundError|Unable to instantiate|Unable to start' phase5-screenshot-diagnostics/*.txt; then
            echo "Fatal runtime marker detected"
            exit 1
          fi
          EOF
          chmod +x phase5-targeted-screenshots.sh
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          echo "KVM WORKING" | tee phase5-screenshot-diagnostics/kvm.txt
      - name: Run Phase 5 screenshots only
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash phase5-targeted-screenshots.sh
      - name: Upload Phase 5 screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azkar-phase5-targeted-screenshots
          path: |
            phase5-evidence/**
            phase5-screenshot-diagnostics/**
          if-no-files-found: error
          retention-days: 7
