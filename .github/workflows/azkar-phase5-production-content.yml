name: Azkar Phase 5 Production Content

on:
  push:
    branches:
      - azkar-native-phase5-production-content-2026-09-30
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Compile Compose/Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Compile instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Prepare Phase 5 instrumentation
        shell: bash
        run: |
          mkdir -p phase5-diagnostics phase5-evidence phase5-regression-evidence
          cat > phase5-production-content.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APP_PACKAGE="app.xalidmuslim.azkar"
          TEST_PACKAGE="app.xalidmuslim.azkar.test"
          TEST_COMPONENT="$TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner"
          REMOTE_DIR="/sdcard/Android/data/$APP_PACKAGE/files/phase2-evidence"
          NAV_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarReaderNavigationInstrumentedTest"
          SHEET_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarReaderSheetInstrumentedTest"
          LIST_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarReaderListModeInstrumentedTest"
          PHASE4_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarReaderPersistenceInstrumentedTest"
          PHASE5_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarPhase5ProductionContentInstrumentedTest"
          GOLDEN_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarGoldenReadingScreenshotTest"
          LIST_GOLDEN_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarListModeScreenshotTest"
          PHASE4_GOLDEN_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarPhase4PersistenceScreenshotTest"
          PHASE5_GOLDEN_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarPhase5ProductionContentScreenshotTest"

          adb wait-for-device
          adb shell getprop sys.boot_completed | tee phase5-diagnostics/boot-completed.txt
          adb devices -l | tee phase5-diagnostics/adb-devices.txt
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell wm size 393x873
          adb shell wm density 160
          adb shell settings put system font_scale 1.0
          timeout 15s adb shell am wait-for-broadcast-idle || true
          adb logcat -c || true

          run_class() {
            local class_name="$1" expected="$2" output="$3"
            set +e
            adb shell am instrument -w -r -e class "$class_name" "$TEST_COMPONENT" | tee "$output"
            local exit_code=${PIPESTATUS[0]}
            set -e
            [ "$exit_code" -eq 0 ]
            grep -q "OK ($expected tests)" "$output"
          }

          run_capture() {
            local class_name="$1" method="$2" screen="$3" filename="$4" width="$5" height="$6" destination="$7"
            adb shell wm size "$screen"
            adb shell wm density 160
            adb shell settings put system font_scale 1.0
            timeout 15s adb shell am wait-for-broadcast-idle || true
            set +e
            adb shell am instrument -w -r -e class "$class_name#$method" "$TEST_COMPONENT" | tee "phase5-diagnostics/capture-$method.txt"
            local exit_code=${PIPESTATUS[0]}
            set -e
            [ "$exit_code" -eq 0 ]
            grep -q "OK (1 test)" "phase5-diagnostics/capture-$method.txt"
            adb pull "$REMOTE_DIR/$filename" "$destination/$filename"
            test -s "$destination/$filename"
            file "$destination/$filename" | tee "phase5-diagnostics/file-$method.txt"
            grep -q "PNG image data, $width x $height" "phase5-diagnostics/file-$method.txt"
          }

          run_class "$NAV_CLASS" 10 phase5-diagnostics/navigation-instrumentation.txt
          run_class "$SHEET_CLASS" 8 phase5-diagnostics/sheets-instrumentation.txt
          run_class "$LIST_CLASS" 15 phase5-diagnostics/list-instrumentation.txt
          run_class "$PHASE4_CLASS" 15 phase5-diagnostics/phase4-instrumentation.txt
          run_class "$PHASE5_CLASS" 20 phase5-diagnostics/phase5-instrumentation.txt

          run_capture "$GOLDEN_CLASS" capture360Light 360x800 azkar_360x800_light.png 360 800 phase5-regression-evidence
          run_capture "$GOLDEN_CLASS" capture393Light 393x873 azkar_393x873_light.png 393 873 phase5-regression-evidence
          run_capture "$GOLDEN_CLASS" capture412Light 412x915 azkar_412x915_light.png 412 915 phase5-regression-evidence
          run_capture "$GOLDEN_CLASS" capture393Dark 393x873 azkar_393x873_dark.png 393 873 phase5-regression-evidence
          run_capture "$GOLDEN_CLASS" capture393LongExistingDhikr 393x873 azkar_393x873_long_baqarah.png 393 873 phase5-regression-evidence
          run_capture "$LIST_GOLDEN_CLASS" capture360LightList 360x800 azkar_360x800_light_list.png 360 800 phase5-regression-evidence
          run_capture "$LIST_GOLDEN_CLASS" capture393LightList 393x873 azkar_393x873_light_list.png 393 873 phase5-regression-evidence
          run_capture "$LIST_GOLDEN_CLASS" capture412LightList 412x915 azkar_412x915_light_list.png 412 915 phase5-regression-evidence
          run_capture "$LIST_GOLDEN_CLASS" capture393DarkList 393x873 azkar_393x873_dark_list.png 393 873 phase5-regression-evidence
          run_capture "$LIST_GOLDEN_CLASS" capture393LightListMiddle 393x873 azkar_393x873_light_list_middle.png 393 873 phase5-regression-evidence
          run_capture "$LIST_GOLDEN_CLASS" capture393LightContentsModeSwitch 393x873 azkar_393x873_light_contents_mode_switch.png 393 873 phase5-regression-evidence
          run_capture "$PHASE4_GOLDEN_CLASS" capture393LightPartialProgress 393x873 azkar_phase4_393_light_partial_progress.png 393 873 phase5-regression-evidence
          run_capture "$PHASE4_GOLDEN_CLASS" capture393LightCompletedDhikr 393x873 azkar_phase4_393_light_completed.png 393 873 phase5-regression-evidence
          run_capture "$PHASE4_GOLDEN_CLASS" capture393LightListCompletedItem 393x873 azkar_phase4_393_light_list_completed.png 393 873 phase5-regression-evidence
          run_capture "$PHASE4_GOLDEN_CLASS" capture393DarkCompletedItem 393x873 azkar_phase4_393_dark_completed.png 393 873 phase5-regression-evidence
          run_capture "$PHASE4_GOLDEN_CLASS" capture393LightSettingsRestoredState 393x873 azkar_phase4_393_light_settings_restored.png 393 873 phase5-regression-evidence

          run_capture "$PHASE5_GOLDEN_CLASS" capture393LightMorningFirst 393x873 azkar_phase5_393_light_morning_first.png 393 873 phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture393LightEveningFirst 393x873 azkar_phase5_393_light_evening_first.png 393 873 phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture393LightMorningContents 393x873 azkar_phase5_393_light_morning_contents.png 393 873 phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture393LightEveningContents 393x873 azkar_phase5_393_light_evening_contents.png 393 873 phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture393LightEveningKingdomVariant 393x873 azkar_phase5_393_light_evening_kingdom.png 393 873 phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture393LightMorningKingdomVariant 393x873 azkar_phase5_393_light_morning_kingdom.png 393 873 phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture393LightEveningList 393x873 azkar_phase5_393_light_evening_list.png 393 873 phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture393DarkEvening 393x873 azkar_phase5_393_dark_evening.png 393 873 phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture360LightMorning 360x800 azkar_phase5_360_light_morning.png 360 800 phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture412LightEvening 412x915 azkar_phase5_412_light_evening.png 412 915 phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" captureLongEveningBaqarahLastTwo 393x873 azkar_phase5_393_long_evening_baqarah.png 393 873 phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" captureCompletedProgressAfterPeriodSwitch 393x873 azkar_phase5_393_completed_after_switch.png 393 873 phase5-evidence

          test "$(find phase5-evidence -maxdepth 1 -name '*.png' | wc -l)" -eq 12
          test "$(find phase5-regression-evidence -maxdepth 1 -name '*.png' | wc -l)" -eq 16
          adb logcat -d -v threadtime > phase5-diagnostics/final-logcat.txt || true
          if grep -RInE 'ANR in app\.xalidmuslim\.azkar|FATAL EXCEPTION|Process crashed|INSTRUMENTATION_FAILED|ClassNotFoundException|NoClassDefFoundError|Unable to instantiate|Unable to start' phase5-diagnostics/*.txt phase5-diagnostics/final-logcat.txt 2>/dev/null; then
            echo "Fatal runtime marker detected"; exit 1
          fi

          {
            echo "Phase 3A Navigation: 10/10 PASS"
            echo "Phase 3B Sheets: 8/8 PASS"
            echo "Phase 3C List: 15/15 PASS"
            echo "Phase 4 Persistence: 15/15 PASS"
            echo "Phase 5 Production Content: 20/20 PASS"
            echo "Legacy Visual Regression: 16/16 PASS"
            echo "Phase 5 Visual Evidence: 12/12 PASS"
            echo "KVM: WORKING"
            echo "Startup ANR: NO"
          } | tee phase5-diagnostics/phase5-summary.txt
          EOF
          chmod +x phase5-production-content.sh

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm | tee phase5-diagnostics/kvm.txt
            echo "KVM WORKING" | tee -a phase5-diagnostics/kvm.txt
          else
            echo "/dev/kvm is not available"
            exit 1
          fi

      - name: Run Phase 5 instrumentation and visual regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash phase5-production-content.sh

      - name: Count unit tests
        if: always()
        shell: bash
        run: |
          mkdir -p phase5-diagnostics
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))
          summary = f"UNIT_TESTS={tests}\nFAILURES={failures}\nERRORS={errors}\nSKIPPED={skipped}\n"
          print(summary)
          open("phase5-diagnostics/unit-test-summary.txt", "w").write(summary)
          PY

      - name: Upload Phase 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azkar-phase5-production-content-evidence
          path: |
            phase5-evidence/**
            phase5-regression-evidence/**
            phase5-diagnostics/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 30
