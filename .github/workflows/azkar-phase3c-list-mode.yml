name: Azkar Phase 3C Reader List Mode

on:
  push:
    branches:
      - azkar-native-phase3c-list-mode-2026-09-29
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile Compose/Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Prepare Phase 3C instrumentation
        shell: bash
        run: |
          mkdir -p phase3c-diagnostics phase3c-evidence
          cat > phase3c-reader-list.sh <<'EOF'
          #!/usr/bin/env bash
          set -u
          set -o pipefail

          APP_PACKAGE="app.xalidmuslim.azkar"
          TEST_PACKAGE="app.xalidmuslim.azkar.test"
          TEST_COMPONENT="$TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner"
          NAV_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarReaderNavigationInstrumentedTest"
          SHEET_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarReaderSheetInstrumentedTest"
          LIST_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarReaderListModeInstrumentedTest"
          GOLDEN_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarGoldenReadingScreenshotTest"
          LIST_GOLDEN_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarListModeScreenshotTest"
          REMOTE_DIR="/sdcard/Android/data/$APP_PACKAGE/files/phase2-evidence"

          adb wait-for-device
          adb shell getprop sys.boot_completed
          adb devices -l

          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace || exit 1
          adb install -r app/build/outputs/apk/debug/app-debug.apk || exit 1
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk || exit 1

          adb shell wm size 393x873
          adb shell wm density 160
          adb shell settings put system font_scale 1.0
          timeout 15s adb shell am wait-for-broadcast-idle || true
          adb logcat -c || true

          run_class() {
            class_name="$1"
            expected="$2"
            output="$3"

            set +e
            adb shell am instrument -w -r -e class "$class_name" "$TEST_COMPONENT" | tee "$output"
            exit_code=${PIPESTATUS[0]}
            set -e
            if [ "$exit_code" -ne 0 ]; then exit "$exit_code"; fi
            grep -q "OK ($expected tests)" "$output" || exit 1
          }

          run_class "$NAV_CLASS" 10 phase3c-diagnostics/navigation-instrumentation.txt
          run_class "$SHEET_CLASS" 8 phase3c-diagnostics/sheets-instrumentation.txt
          run_class "$LIST_CLASS" 15 phase3c-diagnostics/list-instrumentation.txt

          run_capture() {
            class_name="$1"
            method="$2"
            screen="$3"
            filename="$4"
            width="$5"
            height="$6"

            adb shell wm size "$screen" || return 1
            adb shell wm density 160 || return 1
            adb shell settings put system font_scale 1.0 || return 1
            timeout 15s adb shell am wait-for-broadcast-idle || true

            set +e
            adb shell am instrument -w -r -e class "$class_name#$method" "$TEST_COMPONENT" | tee "phase3c-diagnostics/capture-$method.txt"
            test_exit=${PIPESTATUS[0]}
            set -e
            if [ "$test_exit" -ne 0 ]; then return 1; fi
            grep -q "OK (1 test)" "phase3c-diagnostics/capture-$method.txt" || return 1

            adb pull "$REMOTE_DIR/$filename" "phase3c-evidence/$filename" || return 1
            test -s "phase3c-evidence/$filename" || return 1
            stat -c '%n %s bytes' "phase3c-evidence/$filename" | tee "phase3c-diagnostics/file-$method.txt"
            file "phase3c-evidence/$filename" | tee -a "phase3c-diagnostics/file-$method.txt" || return 1
            grep -q "PNG image data, $width x $height" "phase3c-diagnostics/file-$method.txt" || return 1
          }

          run_capture "$GOLDEN_CLASS" capture360Light 360x800 azkar_360x800_light.png 360 800 || exit 1
          run_capture "$GOLDEN_CLASS" capture393Light 393x873 azkar_393x873_light.png 393 873 || exit 1
          run_capture "$GOLDEN_CLASS" capture412Light 412x915 azkar_412x915_light.png 412 915 || exit 1
          run_capture "$GOLDEN_CLASS" capture393Dark 393x873 azkar_393x873_dark.png 393 873 || exit 1
          run_capture "$GOLDEN_CLASS" capture393LongExistingDhikr 393x873 azkar_393x873_long_baqarah.png 393 873 || exit 1

          run_capture "$LIST_GOLDEN_CLASS" capture360LightList 360x800 azkar_360x800_light_list.png 360 800 || exit 1
          run_capture "$LIST_GOLDEN_CLASS" capture393LightList 393x873 azkar_393x873_light_list.png 393 873 || exit 1
          run_capture "$LIST_GOLDEN_CLASS" capture412LightList 412x915 azkar_412x915_light_list.png 412 915 || exit 1
          run_capture "$LIST_GOLDEN_CLASS" capture393DarkList 393x873 azkar_393x873_dark_list.png 393 873 || exit 1
          run_capture "$LIST_GOLDEN_CLASS" capture393LightListMiddle 393x873 azkar_393x873_light_list_middle.png 393 873 || exit 1
          run_capture "$LIST_GOLDEN_CLASS" capture393LightContentsModeSwitch 393x873 azkar_393x873_light_contents_mode_switch.png 393 873 || exit 1

          adb logcat -d -v threadtime > phase3c-diagnostics/final-logcat.txt || true
          if grep -RInE 'ANR in app\.xalidmuslim\.azkar|FATAL EXCEPTION|Process crashed|INSTRUMENTATION_FAILED|ClassNotFoundException|NoClassDefFoundError|Unable to instantiate|Unable to start' phase3c-diagnostics/*.txt phase3c-diagnostics/final-logcat.txt 2>/dev/null; then
            echo "Fatal runtime marker detected"
            exit 1
          fi

          adb uninstall "$TEST_PACKAGE" || true
          adb uninstall "$APP_PACKAGE" || true
          adb shell wm size reset || true
          adb shell wm density reset || true
          adb shell settings put system font_scale 1.0 || true
          EOF
          chmod +x phase3c-reader-list.sh

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is not available"
            exit 1
          fi

      - name: Run Phase 3C instrumentation and visual regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash phase3c-reader-list.sh

      - name: Upload Phase 3C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azkar-phase3c-list-evidence
          path: |
            phase3c-evidence/**
            phase3c-diagnostics/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 30
