name: Azkar Phase 6 Production App Integration

on:
  push:
    branches:
      - azkar-native-phase6-app-integration-2026-09-30
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile Compose Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:processDebugMainManifest --stacktrace

      - name: Verify unit-test count
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase6-diagnostics
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          tests = failures = errors = skipped = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))

          summary = (
              f"UNIT_TESTS={tests}\n"
              f"FAILURES={failures}\n"
              f"ERRORS={errors}\n"
              f"SKIPPED={skipped}\n"
          )
          print(summary)
          open("phase6-diagnostics/unit-test-summary.txt", "w").write(summary)

          if tests < 95 or failures or errors:
              raise SystemExit("Unit regression gate failed")
          PY

      - name: Verify production APK identity and offline manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase6-diagnostics phase6-apk
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee phase6-diagnostics/apk-badging.txt

          grep -Fq "package: name='app.xalidmuslim.azkar'" phase6-diagnostics/apk-badging.txt
          grep -Fq "application-label:'Азкар'" phase6-diagnostics/apk-badging.txt
          grep -Fq "launchable-activity: name='app.xalidmuslim.azkar.MainActivity'" phase6-diagnostics/apk-badging.txt

          if grep -Fq "uses-permission: name='android.permission.INTERNET'" phase6-diagnostics/apk-badging.txt; then
            echo "INTERNET permission unexpectedly present"
            exit 1
          fi

          MERGED="$(find app/build/intermediates -name AndroidManifest.xml | grep -E 'merged_manifest|merged_manifests' | grep '/debug/' | head -n 1)"
          test -n "$MERGED"
          cp "$MERGED" phase6-diagnostics/merged-AndroidManifest.xml

          grep -Fq 'app.xalidmuslim.azkar.MainActivity' phase6-diagnostics/merged-AndroidManifest.xml
          if grep -Eqi 'alfatiha|tafsir|android.permission.INTERNET' phase6-diagnostics/merged-AndroidManifest.xml; then
            echo "Forbidden production-manifest remnant found"
            exit 1
          fi

          if grep -RInE 'android\.webkit\.WebView|WebViewClient|<WebView' app/src/main; then
            echo "WebView usage found in production source"
            exit 1
          fi

          unzip -l "$APK" | tee phase6-diagnostics/apk-files.txt
          grep -Fq 'res/font/literata_variable.ttf' phase6-diagnostics/apk-files.txt
          grep -Fq 'res/font/noto_naskh_arabic_variable.ttf' phase6-diagnostics/apk-files.txt

          cp "$APK" phase6-apk/azkar-phase6-debug.apk
          sha256sum phase6-apk/azkar-phase6-debug.apk | tee phase6-apk/sha256.txt

          {
            echo "PACKAGE=app.xalidmuslim.azkar"
            echo "APP_LABEL=Азкар"
            echo "LAUNCHER=app.xalidmuslim.azkar.MainActivity"
            echo "INTERNET_PERMISSION=ABSENT"
            echo "WEBVIEW=ABSENT"
            echo "LOCAL_FONTS=PASS"
          } | tee phase6-diagnostics/apk-static-verification.txt

      - name: Prepare Phase 6 instrumentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase6-diagnostics phase5-evidence phase6-evidence

          cat > phase6-app-integration.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          APP_PACKAGE="app.xalidmuslim.azkar"
          TEST_PACKAGE="app.xalidmuslim.azkar.test"
          TEST_COMPONENT="$TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner"
          PHASE5_REMOTE="/sdcard/Android/data/$APP_PACKAGE/files/phase2-evidence"
          PHASE6_REMOTE="/sdcard/Android/data/$APP_PACKAGE/files/phase6-evidence"

          NAV_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarReaderNavigationInstrumentedTest"
          SHEET_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarReaderSheetInstrumentedTest"
          LIST_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarReaderListModeInstrumentedTest"
          PHASE4_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarReaderPersistenceInstrumentedTest"
          PHASE5_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarPhase5ProductionContentInstrumentedTest"
          PHASE6_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarPhase6AppIntegrationInstrumentedTest"
          PHASE5_GOLDEN_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarPhase5ProductionContentScreenshotTest"
          PHASE6_GOLDEN_CLASS="app.xalidmuslim.azkar.ui.reading.AzkarPhase6RealAppScreenshotTest"

          adb wait-for-device
          adb shell getprop sys.boot_completed | tee phase6-diagnostics/boot-completed.txt
          adb devices -l | tee phase6-diagnostics/adb-devices.txt
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell wm size 393x873
          adb shell wm density 160
          adb shell settings put system font_scale 1.0
          timeout 15s adb shell am wait-for-broadcast-idle || true
          adb logcat -c || true

          run_class() {
            local class_name="$1"
            local expected="$2"
            local output="$3"
            set +e
            adb shell am instrument -w -r -e class "$class_name" "$TEST_COMPONENT" | tee "$output"
            local exit_code=$?
            set -e
            [ "$exit_code" -eq 0 ]
            grep -q "OK ($expected tests)" "$output"
          }

          run_capture() {
            local class_name="$1"
            local method="$2"
            local screen="$3"
            local filename="$4"
            local width="$5"
            local height="$6"
            local remote_dir="$7"
            local destination="$8"

            adb shell wm size "$screen"
            adb shell wm density 160
            adb shell settings put system font_scale 1.0
            timeout 15s adb shell am wait-for-broadcast-idle || true

            set +e
            adb shell am instrument -w -r -e class "$class_name#$method" "$TEST_COMPONENT" | tee "phase6-diagnostics/capture-$method.txt"
            local exit_code=$?
            set -e
            [ "$exit_code" -eq 0 ]
            grep -q "OK (1 test)" "phase6-diagnostics/capture-$method.txt"

            adb pull "$remote_dir/$filename" "$destination/$filename"
            test -s "$destination/$filename"
            file "$destination/$filename" | tee "phase6-diagnostics/file-$method.txt"
            grep -q "PNG image data, $width x $height" "phase6-diagnostics/file-$method.txt"
          }

          run_class "$NAV_CLASS" 10 phase6-diagnostics/navigation-instrumentation.txt
          run_class "$SHEET_CLASS" 8 phase6-diagnostics/sheets-instrumentation.txt
          run_class "$LIST_CLASS" 15 phase6-diagnostics/list-instrumentation.txt
          run_class "$PHASE4_CLASS" 15 phase6-diagnostics/phase4-instrumentation.txt
          run_class "$PHASE5_CLASS" 20 phase6-diagnostics/phase5-instrumentation.txt
          run_class "$PHASE6_CLASS" 16 phase6-diagnostics/phase6-integration.txt

          run_capture "$PHASE5_GOLDEN_CLASS" capture393LightMorningFirst 393x873 azkar_phase5_393_light_morning_first.png 393 873 "$PHASE5_REMOTE" phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture393LightEveningFirst 393x873 azkar_phase5_393_light_evening_first.png 393 873 "$PHASE5_REMOTE" phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture393LightMorningContents 393x873 azkar_phase5_393_light_morning_contents.png 393 873 "$PHASE5_REMOTE" phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture393LightEveningContents 393x873 azkar_phase5_393_light_evening_contents.png 393 873 "$PHASE5_REMOTE" phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture393LightEveningKingdomVariant 393x873 azkar_phase5_393_light_evening_kingdom.png 393 873 "$PHASE5_REMOTE" phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture393LightMorningKingdomVariant 393x873 azkar_phase5_393_light_morning_kingdom.png 393 873 "$PHASE5_REMOTE" phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture393LightEveningList 393x873 azkar_phase5_393_light_evening_list.png 393 873 "$PHASE5_REMOTE" phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture393DarkEvening 393x873 azkar_phase5_393_dark_evening.png 393 873 "$PHASE5_REMOTE" phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture360LightMorning 360x800 azkar_phase5_360_light_morning.png 360 800 "$PHASE5_REMOTE" phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" capture412LightEvening 412x915 azkar_phase5_412_light_evening.png 412 915 "$PHASE5_REMOTE" phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" captureLongEveningBaqarahLastTwo 393x873 azkar_phase5_393_long_evening_baqarah.png 393 873 "$PHASE5_REMOTE" phase5-evidence
          run_capture "$PHASE5_GOLDEN_CLASS" captureCompletedProgressAfterPeriodSwitch 393x873 azkar_phase5_393_completed_after_switch.png 393 873 "$PHASE5_REMOTE" phase5-evidence

          run_capture "$PHASE6_GOLDEN_CLASS" capture360LightMorning 360x800 azkar_phase6_360_light_morning.png 360 800 "$PHASE6_REMOTE" phase6-evidence
          run_capture "$PHASE6_GOLDEN_CLASS" capture393LightMorning 393x873 azkar_phase6_393_light_morning.png 393 873 "$PHASE6_REMOTE" phase6-evidence
          run_capture "$PHASE6_GOLDEN_CLASS" capture412LightMorning 412x915 azkar_phase6_412_light_morning.png 412 915 "$PHASE6_REMOTE" phase6-evidence
          run_capture "$PHASE6_GOLDEN_CLASS" capture393DarkMorning 393x873 azkar_phase6_393_dark_morning.png 393 873 "$PHASE6_REMOTE" phase6-evidence
          run_capture "$PHASE6_GOLDEN_CLASS" capture393LightEvening 393x873 azkar_phase6_393_light_evening.png 393 873 "$PHASE6_REMOTE" phase6-evidence
          run_capture "$PHASE6_GOLDEN_CLASS" capture393DarkEvening 393x873 azkar_phase6_393_dark_evening.png 393 873 "$PHASE6_REMOTE" phase6-evidence
          run_capture "$PHASE6_GOLDEN_CLASS" capture393Contents 393x873 azkar_phase6_393_contents.png 393 873 "$PHASE6_REMOTE" phase6-evidence
          run_capture "$PHASE6_GOLDEN_CLASS" capture393Settings 393x873 azkar_phase6_393_settings.png 393 873 "$PHASE6_REMOTE" phase6-evidence
          run_capture "$PHASE6_GOLDEN_CLASS" capture393Explanation 393x873 azkar_phase6_393_explanation.png 393 873 "$PHASE6_REMOTE" phase6-evidence
          run_capture "$PHASE6_GOLDEN_CLASS" capture393ListMode 393x873 azkar_phase6_393_list.png 393 873 "$PHASE6_REMOTE" phase6-evidence

          test "$(find phase5-evidence -maxdepth 1 -name '*.png' | wc -l)" -eq 12
          test "$(find phase6-evidence -maxdepth 1 -name '*.png' | wc -l)" -eq 10

          adb shell wm size 393x873
          adb shell pm clear "$APP_PACKAGE"
          adb shell am force-stop "$APP_PACKAGE"
          adb logcat -c || true
          adb shell am start -W -n "$APP_PACKAGE/.MainActivity" | tee phase6-diagnostics/apk-launch.txt
          grep -q "Status: ok" phase6-diagnostics/apk-launch.txt
          sleep 2
          adb shell pidof "$APP_PACKAGE" | tee phase6-diagnostics/apk-pid.txt
          test -s phase6-diagnostics/apk-pid.txt
          adb shell dumpsys activity activities | grep -E 'topResumedActivity|mResumedActivity' | grep "$APP_PACKAGE/.MainActivity" | tee phase6-diagnostics/resumed-activity.txt

          adb logcat -d -v threadtime > phase6-diagnostics/final-logcat.txt || true
          if grep -RInE 'ANR in app\.xalidmuslim\.azkar|FATAL EXCEPTION|Process crashed|INSTRUMENTATION_FAILED|ClassNotFoundException|NoClassDefFoundError|Unable to instantiate|Unable to start' phase6-diagnostics/*.txt phase6-diagnostics/final-logcat.txt 2>/dev/null; then
            echo "Fatal runtime marker detected"
            exit 1
          fi

          {
            echo "Phase 3A Navigation: 10/10 PASS"
            echo "Phase 3B Sheets: 8/8 PASS"
            echo "Phase 3C List: 15/15 PASS"
            echo "Phase 4 Persistence: 15/15 PASS"
            echo "Phase 5 Production Content: 20/20 PASS"
            echo "Phase 5 Visual Evidence: 12/12 PASS"
            echo "Phase 6 Integration: 16/16 PASS"
            echo "Phase 6 Real-App Screenshots: 10/10 PASS"
            echo "APK Install: PASS"
            echo "APK Launch: PASS"
            echo "KVM: WORKING"
            echo "Startup ANR: NO"
          } | tee phase6-diagnostics/phase6-summary.txt
          EOF

          chmod +x phase6-app-integration.sh

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm | tee phase6-diagnostics/kvm.txt
            echo "KVM WORKING" | tee -a phase6-diagnostics/kvm.txt
          else
            echo "/dev/kvm is not available"
            exit 1
          fi

      - name: Run Phase 6 full instrumentation and real-app evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash phase6-app-integration.sh

      - name: Upload Phase 6 app integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azkar-phase6-app-integration-evidence
          path: |
            phase6-evidence/**
            phase5-evidence/**
            phase6-diagnostics/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 30

      - name: Upload Phase 6 debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: azkar-phase6-debug-apk
          path: |
            phase6-apk/**
          if-no-files-found: error
          retention-days: 30
